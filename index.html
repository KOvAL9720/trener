  <style>
    /* Úvodná obrazovka – inline, aby sa ukázala okamžite */
    html, body { background: #0b0b0c; }
    @media (prefers-color-scheme: light) { html, body, #splash { background: #eceef1 !important; } }
    /* obsah aplikácie skrytý, kým sa nenačítajú jej štýly – žiadne preskakovanie rozloženia */
    .topbar, .nav, main { visibility: hidden; }
    #splash { position: fixed; inset: 0; z-index: 1000; background: #0b0b0c; display: grid; place-items: center; transition: opacity .35s ease, visibility .35s; }
    #splash.hide { opacity: 0; visibility: hidden; }
    #splash .line { position: relative; width: 100vw; height: 3px; background: rgba(143, 220, 210, .12); overflow: hidden; }
    #splash .line::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, #b9ebe4, #46b3a7); box-shadow: 0 0 14px #46b3a7; transform-origin: left; animation: splash-fill .55s cubic-bezier(.45, 0, .25, 1) forwards, splash-glow .25s ease-out .55s forwards; }
    #splash .line::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .9), transparent); animation: splash-sheen .55s cubic-bezier(.45, 0, .25, 1) forwards; }
    @keyframes splash-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes splash-glow { 50% { box-shadow: 0 0 26px 4px #46b3a7; } 100% { box-shadow: 0 0 16px 1px #46b3a7; } }
    @keyframes splash-sheen { from { transform: translateX(-120%); } to { transform: translateX(280%); } }
    @media (prefers-reduced-motion: reduce) { #splash .line::before, #splash .line::after { animation: none; } }
  </style>
  <!-- Štýly aplikácie neblokujú vykreslenie – úvodná obrazovka (inline) sa ukáže okamžite -->
  <link rel="stylesheet" href="css/styles.css" media="print" onload="this.media='all';document.documentElement.classList.add('css-ready');window.dispatchEvent(new Event('cssready'))">

  <script src="js/exercise-icons.js" defer></script>
  <!-- cloud (klientska zóna) – samostatný modul, pri výpadku siete appka beží ďalej -->
  <script type="module">
    // cloud (Firebase z internetu) sa načíta až po vykreslení obsahu, aby nebrzdil štart;
    // ak sa nenačíta, appka ukáže dôvod v Nastaveniach
    // Safari pri slabom signáli (napr. hneď po prebudení appky) niekedy modul nestiahne – skúsi sa ešte 2× s pauzou
    let cloudTry = 0;
    const loadCloud = () => import(`./js/cloud.js${cloudTry ? `?pokus=${cloudTry}` : ''}`).catch((e) => {
      cloudTry++;
      if (cloudTry < 3) { setTimeout(loadCloud, cloudTry * 2500); return; }
      window.cloudError = (e && (e.message || String(e))) || 'neznáma chyba';
      window.dispatchEvent(new Event('cloud-ready'));
    });
    if (document.readyState === 'complete') loadCloud(); else window.addEventListener('load', loadCloud, { once: true });
  </script>
  <script src="js/app.js" defer></script>
  <!-- živý tréning (časovač, série naživo) -->
  <script src="js/live.js" defer></script>
  <!-- kalendár s časovou osou (presúvanie ťahaním) -->
