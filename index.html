<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#09090b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    /* Úvodná obrazovka – inline, aby sa ukázala okamžite */
    html, body { background: #09090b; }
    #splash { position: fixed; inset: 0; z-index: 1000; background: #09090b; display: grid; place-items: center; transition: opacity .55s ease, visibility .55s; }
    #splash.hide { opacity: 0; visibility: hidden; }
    #splash .line { position: relative; width: min(240px, 62vw); height: 3px; border-radius: 3px; background: rgba(255, 168, 213, .12); overflow: hidden; }
    #splash .line::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, #ffc2e2, #ff7ebf); box-shadow: 0 0 14px #ff7ebf; transform-origin: left; animation: splash-fill 2.6s cubic-bezier(.45, 0, .25, 1) forwards, splash-glow .6s ease-out 2.6s forwards; }
    #splash .line::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .9), transparent); animation: splash-sheen 1.3s ease-in-out .3s infinite; }
    @keyframes splash-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes splash-glow { 50% { box-shadow: 0 0 26px 4px #ff7ebf; } 100% { box-shadow: 0 0 16px 1px #ff7ebf; } }
    @keyframes splash-sheen { from { transform: translateX(-120%); } to { transform: translateX(280%); } }
    @media (prefers-reduced-motion: reduce) { #splash .line::before, #splash .line::after { animation: none; } }
  </style>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="splash" aria-hidden="true"><div class="line"></div></div>

    <a href="#/clients" data-nav="clients">
